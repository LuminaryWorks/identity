# LuminaryWorks 统一登录授权服务（Logto + PostgreSQL + Redis）
#
# 用法:
#   ./bootstrap.sh           # 一键拉起 + 注册应用
#   docker compose up -d     # 仅启动（带 unless-stopped，Docker Desktop 开机后自动拉起）
#   docker compose stop      # 临时停止（容器保留，下次 Desktop 启动仍会自启）
#   docker compose down      # 移除容器（需再次 up 才会恢复自启）
#
#   OIDC:  http://localhost:3001/oidc
#   Admin: http://localhost:3002
#   Logo:  https://cdn.luminaryworks.dev/logo/luminaryworks-logo.svg
#
# 产品后端通过 IDP_ISSUER + JWKS 验签；前端走 OIDC PKCE / Experience Headless。
# 资源级 AuthZ 在各产品 Casbin，不在本 compose。
#
# 自动启动：服务均 restart: unless-stopped。
# Docker Desktop 启动后会自动恢复本栈（需本机已执行过一次 compose up，且未 down）。

name: identity

services:
  identity-db:
    image: postgres:16-alpine
    container_name: luminary-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-logto_dev_password}
      POSTGRES_DB: logto
    ports:
      - "${IDENTITY_DB_PORT:-5433}:5432"
    volumes:
      - luminary_identity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  identity-redis:
    image: redis:7-alpine
    container_name: luminary-identity-redis
    restart: unless-stopped
    ports:
      - "${IDENTITY_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  identity:
    image: svhd/logto:latest
    container_name: luminary-identity
    restart: unless-stopped
    depends_on:
      identity-db:
        condition: service_healthy
      identity-redis:
        condition: service_healthy
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://logto:${IDENTITY_DB_PASSWORD:-logto_dev_password}@identity-db:5432/logto
      ENDPOINT: ${IDENTITY_ENDPOINT:-http://localhost:3001}
      ADMIN_ENDPOINT: ${IDENTITY_ADMIN_ENDPOINT:-http://localhost:3002}
      REDIS_URL: redis://identity-redis:6379
    ports:
      - "${IDENTITY_PORT:-3001}:3001"
      - "${IDENTITY_ADMIN_PORT:-3002}:3002"
    # seed 幂等；start_period 覆盖首次 seed + 启动窗口，避免 Desktop 重启时误报 unhealthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3001/oidc/.well-known/openid-configuration || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

volumes:
  # 固定绝对卷名（不随 compose project 前缀变化），新机首次 up 会自动创建
  luminary_identity_pg:
    name: identity_luminary_identity_pg
